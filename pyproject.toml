[project]
name = "agentia-png"
version = "0.2.0"
description = "Plateforme d'agents IA pour la direction (marketing, marchés publics, commercial, assistanat, administratif, certification RSE) basée sur LangChain + LangGraph."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
web = ["streamlit>=1.30.0"]

[project.scripts]
agentia = "agentia.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E501 (longueur de ligne) ignoré : les textes en français des YAML/commentaires
# peuvent dépasser, ce n'est pas bloquant pour la qualité.
ignore = ["E501"]
