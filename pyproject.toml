[project]
name = "agentia-png"
version = "0.1.0"
description = "Plateforme d'agents IA pour la direction (marketing, marchés publics, commercial, assistanat, administratif, certification RSE) basée sur CrewAI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "crewai>=0.80.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
web = ["streamlit>=1.30.0"]

[project.scripts]
agentia = "agentia.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
