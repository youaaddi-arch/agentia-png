name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  qualite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les outils de test
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest ruff

      - name: Vérifier la syntaxe (compilation)
        run: python -m py_compile app.py src/agentia/*.py

      - name: Lint (ruff)
        run: ruff check src tests app.py

      - name: Tests (configuration et routage)
        run: pytest -q
